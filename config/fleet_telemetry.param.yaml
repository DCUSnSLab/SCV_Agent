/**:
  ros__parameters:
    streams_file: ""
    # zstd 3 is the library default; telemetry is small, so speed matters more than ratio.
    zstd_level: 3
    link:
      prefix: "scv/r01"
      # The vehicle's router, tierlink_edge on this host; it holds the links to the server.
      connect: ["tcp/127.0.0.1:7447"]
      tick_ms: 10
      burst_ms: 200
      delay_window_ms: 10000
      # How often the Uplink reports to the link manager (tierlink_edge).
      report_ms: 100
      # Larger items go out in pieces of this size, paced by the budget, so one point cloud
      # never puts more than this into the link's queue at once.
      chunk_bytes: 4096
      # The link manager publishes every 100 ms; after this long without a budget, monitoring
      # runs on its own controller (rate.*).
      budget_expires_ms: 500
      # Period of the stream catalog the server reads types from.
      catalog_ms: 100
    command:
      # A command must carry a time to live no longer than this; the clocks are synchronized.
      max_ttl_ms: 10000
      # How many recent command ids are kept to run a resent command only once.
      remember: 1024
    rate:
      start_kbps: 200
      min_kbps: 20
      max_kbps: 2000
      step_kbps: 50
      factor: 0.7
      hold_ms: 300
      probe_ms: 1000
      congested_above_ms: 100
      clear_below_ms: 30
