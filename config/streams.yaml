# What the agent sends and which topics the server may publish to. Topics here are SCV's; a
# vehicle with other topics copies this file and points streams_file at the copy.
streams:
  - { name: odom, topic: /odom, type: nav_msgs/msg/Odometry, delivery: latest, rate_hz: 2 }
  - { name: imu, topic: /vectornav/imu, type: sensor_msgs/msg/Imu, delivery: latest, rate_hz: 2 }
  - name: diagnostics
    topic: /diagnostics
    type: diagnostic_msgs/msg/DiagnosticArray
    delivery: reliable
    rate_hz: 1
  # hunter_mux: the selected source and mode, and whether the e-stop is latched.
  - name: mux_status
    topic: /vehicle/mux_status
    type: hunter_mux_msgs/msg/MuxStatus
    delivery: latest
    rate_hz: 2
  - name: estop_status
    topic: /vehicle/estop_status
    type: hunter_mux_msgs/msg/EStopStatus
    delivery: latest
    rate_hz: 2
  # The VLP-32C (velodyne_pointcloud with organize_cloud) as a range image: ranges rounded to
  # 2 cm, intensity's upper 4 bits, zstd, in 8 sectors that each decode alone. 57 KB a scan on
  # SCV's recorded scans (error 0.4 cm median, 0.8 cm p99), so 2 Hz is about 0.9 Mbit/s; it takes
  # what teleop leaves.
  - name: lidar
    topic: /velodyne_points
    type: sensor_msgs/msg/PointCloud2
    delivery: reliable
    rate_hz: 2
    transport: udp
    range: { step_m: 0.02, max_range_m: 120, sectors: 8, intensity_bits: 4 }
commands:
  # Disarms remote driving; teleop_control listens on this topic.
  - { id: stop, topic: /teleop/stop, type: std_msgs/msg/Empty }
  # hunter_mux: latch the e-stop, release it (only once no cause is active), and pick the source
  # (CmdMode.mode 1 navigation, 2 remote).
  - { id: estop, topic: /remote/estop, type: std_msgs/msg/Empty }
  - { id: estop_reset, topic: /remote/estop_reset, type: std_msgs/msg/Empty }
  - { id: cmd_mode, topic: /remote/cmd_mode, type: hunter_mux_msgs/msg/CmdMode }
