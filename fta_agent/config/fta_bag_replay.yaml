# rosbag 재생 기반 대역폭 측정용 설정 (M3/M6)
#
# 대상: ~/data/rosbag2_2026_01_21-18_41_02 의 실측 토픽 (docs/05 §2)
#   ros2 bag play <bag> --topics /odom_bae /vectornav/imu \
#       /camera/camera/color/image_raw /velodyne_points
# 실행 전: export ROBOT_ID=r01

agent:
  robot_id: ${ROBOT_ID}
  queue_maxlen_per_priority: 256

transport:
  type: mqtt
  mqtt:
    host: localhost
    port: 1883
    tls: false
    keepalive_sec: 30

pipelines:
  # 상태: 오도메트리 50Hz → 2Hz, CDR+zstd
  - name: odom
    topic: /odom_bae
    msg_type: nav_msgs/msg/Odometry
    sampler: { type: rate, hz: 2 }
    codec: { type: cdr_zstd }
    priority: high
    msg_class: state

  # 상태: IMU 20Hz → 5Hz
  - name: imu
    topic: /vectornav/imu
    msg_type: sensor_msgs/msg/Imu
    sampler: { type: rate, hz: 5 }
    codec: { type: cdr_zstd }
    priority: normal
    msg_class: state

  # Bulk: 카메라 저빈도 프리뷰 (0.5fps, JPEG q60 640px)
  - name: front_cam_preview
    topic: /camera/camera/color/image_raw
    msg_type: sensor_msgs/msg/Image
    sampler: { type: rate, hz: 0.5 }
    codec: { type: jpeg, quality: 60, max_width: 640 }
    priority: low
    msg_class: bulk

  # Bulk: 카메라 온디맨드 스냅샷 (고품질)
  - name: front_cam_snapshot
    topic: /camera/camera/color/image_raw
    msg_type: sensor_msgs/msg/Image
    sampler: { type: on_demand }
    codec: { type: jpeg, quality: 85 }
    priority: low
    msg_class: bulk

  # Bulk: LiDAR 저빈도 (0.2Hz) 복셀 다운샘플
  - name: lidar_preview
    topic: /velodyne_points
    msg_type: sensor_msgs/msg/PointCloud2
    sampler: { type: rate, hz: 0.2 }
    codec: { type: voxel_zstd, voxel_size: 0.2 }
    priority: low
    msg_class: bulk

  # Bulk: LiDAR 온디맨드
  - name: lidar_snapshot
    topic: /velodyne_points
    msg_type: sensor_msgs/msg/PointCloud2
    sampler: { type: on_demand }
    codec: { type: voxel_zstd, voxel_size: 0.1 }
    priority: low
    msg_class: bulk
