# r02 — 가상 차량: 실주행 필드런 (field_20260820_mppi_run2, 8/20 MPPI 주행 691s)
#
# 이 bag 에는 **실측 GPS**(/ublox_gps_node/fix)가 있어 gps_shim 없이 지도에 실제
# 주행 궤적이 그려진다 (r01 은 여전히 shim 가상 원점 — 대조 유지).
# LaserScan 전후방·depth 카메라·IMU 100Hz 포함 — SCAN 패널·플롯 위젯의 실데이터 소스.
# teleop_rover_msgs 등 커스텀 타입 토픽은 재생 대상에서 제외(BAG_TOPICS).
agent:
  robot_id: ${ROBOT_ID}
  queue_maxlen_per_priority: 256
  buffer:
    dir: /var/lib/fta/buffer
    max_disk_mb: 512
  resource:
    bandwidth_limit_kbps: 10000  # 요구 ~2Mbps 대비 5배 여유 — 5G 음영 순간에도 무적체
    cpu_limit_pct: 50
    mem_limit_mb: 1024
  telemetry:
    interval_sec: 5

# 다운링크 — 서버 레지스트리 동기화 + 명령 수신 (검증 체인 NFR-7)
downlink:
  enabled: true
  audit_log: /var/lib/fta/fta_audit.jsonl

transport:
  type: mqtt
  mqtt:
    host: ${MQTT_HOST}
    port: 1883
    tls: false
    keepalive_sec: 30

pipelines:
  # ── 상태 ──────────────────────────────────────────────────────────
  - name: gps
    topic: /ublox_gps_node/fix          # 실측 GPS — shim 아님
    msg_type: sensor_msgs/msg/NavSatFix
    sampler: { type: rate, hz: 5 }
    codec: { type: cdr_zstd }
    priority: high
    msg_class: state

  - name: gps_vel
    topic: /ublox_gps_node/fix_velocity
    msg_type: geometry_msgs/msg/TwistWithCovarianceStamped
    sampler: { type: rate, hz: 5 }
    codec: { type: cdr_zstd }
    priority: normal
    msg_class: state

  - name: chassis
    topic: /hunter_status               # 배터리 전압·조향각
    msg_type: hunter_msgs/msg/HunterStatus
    sampler: { type: rate, hz: 10 }
    codec: { type: cdr_zstd }
    priority: high
    msg_class: state

  - name: speed
    topic: /hunter/velocity
    msg_type: std_msgs/msg/Float64
    sampler: { type: rate, hz: 10 }
    codec: { type: cdr_zstd }
    priority: high
    msg_class: state

  - name: steer
    topic: /current_steer_angle
    msg_type: std_msgs/msg/Float64
    sampler: { type: rate, hz: 10 }
    codec: { type: cdr_zstd }
    priority: normal
    msg_class: state

  - name: odom
    topic: /odometry/global
    msg_type: nav_msgs/msg/Odometry
    sampler: { type: rate, hz: 10 }
    codec: { type: cdr_zstd }
    priority: high
    msg_class: state

  - name: imu
    topic: /vectornav/imu               # 100Hz 원본 — 플롯 위젯용 10Hz 샘플
    msg_type: sensor_msgs/msg/Imu
    sampler: { type: rate, hz: 10 }
    codec: { type: cdr_zstd }
    priority: normal
    msg_class: state

  # ── 스캔 (SCAN FRONT/REAR 패널) ───────────────────────────────────
  - name: front_scan
    topic: /front/scan
    msg_type: sensor_msgs/msg/LaserScan
    sampler: { type: rate, hz: 5 }
    codec: { type: cdr_zstd }
    priority: low
    msg_class: state

  - name: rear_scan
    topic: /rear/scan
    msg_type: sensor_msgs/msg/LaserScan
    sampler: { type: rate, hz: 5 }
    codec: { type: cdr_zstd }
    priority: low
    msg_class: state

  # ── 미디어 ────────────────────────────────────────────────────────
  - name: front_cam_preview
    topic: /camera/camera/color/image_raw
    msg_type: sensor_msgs/msg/Image
    sampler: { type: rate, hz: 5 }
    codec: { type: jpeg, quality: 60, max_width: 640 }
    priority: low
    msg_class: bulk

  - name: depth_preview
    topic: /camera/camera/depth/image_rect_raw
    msg_type: sensor_msgs/msg/Image
    sampler: { type: rate, hz: 5 }
    codec: { type: jpeg, quality: 60, max_width: 640 }
    priority: low
    msg_class: bulk

  # 필드런 velodyne 은 실외 밀도가 높아 voxel 0.2 로도 프레임 253KB(7.3Mbps@5Hz) —
  # 대역 포화로 low 큐 6.5s 적체 실측. 프리뷰 용도에 맞게 다이어트(0.35/3Hz ≈ 0.7Mbps).
  - name: lidar_preview
    topic: /velodyne_points
    msg_type: sensor_msgs/msg/PointCloud2
    sampler: { type: rate, hz: 3 }
    codec: { type: voxel_zstd, voxel_size: 0.35 }
    priority: low
    msg_class: bulk

  - name: front_cam_snapshot
    topic: /camera/camera/color/image_raw
    msg_type: sensor_msgs/msg/Image
    sampler: { type: on_demand }
    codec: { type: jpeg, quality: 85 }
    priority: low
    msg_class: bulk
