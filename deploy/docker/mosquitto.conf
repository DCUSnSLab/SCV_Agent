# 개발용 브로커 — 가상 차량 스택 단독 구동 시에만 사용한다.
# 관제 콘솔(autodrive-ops)과 함께 돌릴 때는 EMQX 를 쓰고 이 서비스는 띄우지 않는다.
listener 1883
allow_anonymous true

# persistence 는 선택이 아니라 요구사항이다 — 브로커 재시작 시 세션이 사라지면
# FTA DiskBuffer 가 배출한 QoS1 이벤트가 유실된다(M4 검증에서 실제로 관측됨,
# 06 문서 M4 증빙 각주). 실서버 브로커에도 동일하게 요구한다.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type warning
log_type error
log_type notice
