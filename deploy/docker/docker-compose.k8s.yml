# 가상 차량을 k8s 운영(main) 스택에 붙이는 override — LoadBalancer IP 경유.
# 203.250.33.86 은 frontend(80)와 EMQX(1883)가 공유하는 MetalLB IP 다.
#
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/docker/docker-compose.k8s.yml up -d r01 r02
services:
  broker:
    profiles: ["disabled"]
  r01:
    depends_on: !reset []
    environment:
      MQTT_HOST: 203.250.33.86
  r02:
    depends_on: !reset []
    environment:
      MQTT_HOST: 203.250.33.86
